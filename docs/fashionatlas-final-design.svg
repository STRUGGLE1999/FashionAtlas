<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">FashionAtlas final MVP design board</title>
  <desc id="desc">A high contrast editorial directory interface design for FashionAtlas, showing homepage and resource library screens.</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .ink { fill: #09090b; }
      .muted { fill: #52525b; }
      .line { stroke: #d4d4d8; stroke-width: 1.4; }
      .panel { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.4; }
      .dark { fill: #18181b; }
      .pink { fill: #db2777; }
      .green { fill: #0f766e; }
      .blue { fill: #1d4ed8; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: Inter, Arial, sans-serif; }
      .small { font-size: 18px; }
      .tiny { font-size: 14px; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: 2px; }
      .h1 { font-size: 78px; font-weight: 500; }
      .h2 { font-size: 42px; font-weight: 500; }
      .body { font-size: 22px; }
      .shadow { filter: drop-shadow(0 20px 34px rgba(9,9,11,.12)); }
    </style>
    <pattern id="grid" width="100" height="64" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V64" fill="none" stroke="#e4e4e7" stroke-width="1"/>
    </pattern>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset=".48" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1600" height="1100"/>
  <rect width="1600" height="1100" fill="url(#grid)" opacity=".9"/>

  <text x="72" y="86" class="pink sans label">FINAL MVP DESIGN</text>
  <text x="72" y="158" class="ink serif h1">FashionAtlas</text>
  <text x="74" y="203" class="muted sans body">时尚学习资源档案 · Swiss editorial directory · Search first</text>

  <g transform="translate(72 260)" class="shadow">
    <rect class="panel" width="900" height="620" rx="8"/>
    <rect x="0" y="0" width="900" height="66" fill="#ffffff" stroke="#d4d4d8"/>
    <rect x="26" y="16" width="36" height="36" class="dark"/>
    <text x="34" y="40" fill="#fafafa" class="serif tiny">FA</text>
    <text x="78" y="39" class="ink sans small" font-weight="800">FashionAtlas</text>
    <text x="652" y="39" class="muted sans tiny">资源库</text>
    <text x="724" y="39" class="muted sans tiny">学习路径</text>
    <text x="812" y="39" class="muted sans tiny">专题</text>

    <g transform="translate(44 112)">
      <text class="pink sans label" x="0" y="0">CURATED FASHION LEARNING ARCHIVE</text>
      <text class="ink serif h1" x="0" y="86">A visual archive</text>
      <text class="ink serif h1" x="0" y="166">for fashion culture.</text>
      <text class="muted sans small" x="0" y="214">Search runway, books, museums, trends, tools and learning routes.</text>

      <rect x="0" y="252" width="520" height="72" fill="#ffffff" stroke="#09090b" rx="8"/>
      <text x="22" y="296" class="muted sans small">搜索品牌、风格、年代、课程...</text>
      <rect x="370" y="263" width="136" height="50" class="dark" rx="8"/>
      <text x="404" y="295" fill="#fafafa" class="sans small" font-weight="800">搜索</text>

      <g transform="translate(0 360)">
        <rect width="120" height="96" class="panel" rx="8"/>
        <text x="16" y="46" class="ink serif h2">109</text>
        <text x="16" y="74" class="muted sans tiny">策展资源</text>
        <rect x="132" width="120" height="96" class="panel" rx="8"/>
        <text x="148" y="46" class="ink serif h2">8</text>
        <text x="148" y="74" class="muted sans tiny">核心频道</text>
        <rect x="264" width="120" height="96" class="panel" rx="8"/>
        <text x="280" y="46" class="ink serif h2">6</text>
        <text x="280" y="74" class="muted sans tiny">学习路径</text>
        <rect x="396" width="120" height="96" class="panel" rx="8"/>
        <text x="412" y="46" class="ink serif h2">6</text>
        <text x="412" y="74" class="muted sans tiny">编辑专题</text>
      </g>
    </g>

    <g transform="translate(628 112)">
      <rect width="220" height="390" rx="8" fill="url(#hero)"/>
      <line x1="28" y1="300" x2="192" y2="300" stroke="#fafafa" opacity=".7"/>
      <text x="28" y="332" fill="#fafafa" class="serif small">Curated resources,</text>
      <text x="28" y="360" fill="#fafafa" class="serif small">not content dumps.</text>
    </g>
  </g>

  <g transform="translate(1020 260)" class="shadow">
    <rect class="panel" width="508" height="620" rx="8"/>
    <text x="34" y="54" class="pink sans label">RESOURCE LIBRARY</text>
    <text x="34" y="104" class="ink serif h2">目录式工作台</text>

    <g transform="translate(34 136)">
      <rect class="panel" width="140" height="420" rx="8"/>
      <text x="18" y="36" class="ink sans tiny" font-weight="800">筛选器</text>
      <rect x="18" y="62" width="104" height="34" fill="#fafafa" stroke="#d4d4d8" rx="8"/>
      <rect x="18" y="116" width="104" height="34" fill="#fafafa" stroke="#d4d4d8" rx="8"/>
      <rect x="18" y="170" width="104" height="34" fill="#fafafa" stroke="#d4d4d8" rx="8"/>
      <rect x="18" y="224" width="104" height="34" fill="#fafafa" stroke="#d4d4d8" rx="8"/>
      <rect x="18" y="278" width="104" height="34" fill="#fafafa" stroke="#d4d4d8" rx="8"/>
      <rect x="18" y="342" width="104" height="38" fill="#18181b" rx="8"/>
      <text x="45" y="367" fill="#fafafa" class="sans tiny" font-weight="800">重置</text>
    </g>

    <g transform="translate(196 136)">
      <text x="0" y="20" class="ink sans small" font-weight="800">109 条结果</text>
      <g transform="translate(0 48)">
        <rect class="panel" width="260" height="130" rx="8"/>
        <rect width="88" height="130" fill="#18181b" rx="8"/>
        <circle cx="44" cy="66" r="28" fill="#db2777" opacity=".75"/>
        <text x="108" y="34" class="pink sans tiny" font-weight="800">Runway</text>
        <text x="108" y="66" class="ink sans small" font-weight="800">Vogue Runway</text>
        <text x="108" y="94" class="muted sans tiny">秀场、品牌、季节入口</text>
      </g>
      <g transform="translate(0 194)">
        <rect class="panel" width="260" height="130" rx="8"/>
        <rect width="88" height="130" fill="#0f766e" rx="8"/>
        <circle cx="44" cy="66" r="28" fill="#fafafa" opacity=".65"/>
        <text x="108" y="34" class="pink sans tiny" font-weight="800">History</text>
        <text x="108" y="66" class="ink sans small" font-weight="800">V&amp;A Fashion</text>
        <text x="108" y="94" class="muted sans tiny">馆藏、展览、时尚史</text>
      </g>
      <g transform="translate(0 340)">
        <rect class="panel" width="260" height="80" rx="8"/>
        <text x="18" y="34" class="ink sans small" font-weight="800">Trust Layer</text>
        <text x="18" y="60" class="muted sans tiny">合法来源 · 版权说明 · 学习价值</text>
      </g>
    </g>
  </g>

  <g transform="translate(72 940)">
    <text class="ink serif h2" x="0" y="0">Design system</text>
    <text class="muted sans small" x="0" y="40">Playfair Display / Inter · #09090B #FAFAFA #DB2777 · 12-column grid · Directory-first UX</text>
    <rect x="0" y="70" width="72" height="42" fill="#09090b"/>
    <rect x="84" y="70" width="72" height="42" fill="#fafafa" stroke="#d4d4d8"/>
    <rect x="168" y="70" width="72" height="42" fill="#db2777"/>
    <rect x="252" y="70" width="72" height="42" fill="#0f766e"/>
    <rect x="336" y="70" width="72" height="42" fill="#1d4ed8"/>
  </g>
</svg>
